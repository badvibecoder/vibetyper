services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
  app:
    build: .
    environment:
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@acme.test
      MAIL_PREVIEW_URL: http://localhost:8025

services:
  elasticsearch:
    image: elasticsearch:8.14.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
  kibana:
    image: kibana:8.14.2
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
volumes:
  es-data: {}

services:
  catalog:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: products
      DB_USER: catalog
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: localdev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data: {}

services:
  inventory:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: products
      DB_USER: catalog
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: localdev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data: {}

services:
  web:
    image: nginx:1.27-alpine
    profiles: ["frontend"]
    ports:
      - "80:80"
  api:
    build: .
    profiles: ["backend"]
    ports:
      - "8000:8000"
  seed:
    build: .
    profiles: ["tools"]
    command: npm run seed
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - main-data:/var/lib/postgresql/data
volumes:
  main-data: {}

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - analytics-data:/var/lib/postgresql/data
volumes:
  analytics-data: {}

x-common: &common
  restart: unless-stopped
  networks:
    - backend
services:
  api:
    <<: *common
    build: ./api
    ports:
      - "8080:8080"
  worker:
    <<: *common
    build: ./worker
    command: node worker.js
    depends_on:
      - api
networks:
  backend:

services:
  rs:
    build: .
    ports:
      - "8001:8000"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

services:
  rs:
    build: .
    ports:
      - "8010:8000"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

services:
  trainer:
    build: ./ml
    environment:
      PYTHONUNBUFFERED: "1"
      DATASET_PATH: /data/train.csv
      MODEL_OUTPUT: /models/latest.pkl
    volumes:
      - ./data:/data:ro
      - ./models:/models
    command: python train.py --epochs 50 --batch-size 32
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

services:
  api:
    image: us-docker.pkg.dev/us-central1/apps/api:1.4.0
    ports:
      - "8080:8080"
    environment:
      GCP_PROJECT: us-central1-monitoring
      GCP_REGION: us-central1
  collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - api

services:
  api:
    image: us-docker.pkg.dev/europe-west1/apps/api:1.4.0
    ports:
      - "8080:8080"
    environment:
      GCP_PROJECT: europe-west1-monitoring
      GCP_REGION: europe-west1
  collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - api

services:
  app:
    env_file:
      - .env
      - .env.local
    image: node:20-slim
    working_dir: /srv/app
    command: node server.js
    ports:
      - "3000:3000"
    depends_on:
      - db
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: {}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - GO_VERSION=1.22
    ports:
      - "9090:9090"
    environment:
      GIN_MODE: release
      PORT: "9090"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goapp
      POSTGRES_USER: goapp
      POSTGRES_PASSWORD: localdev

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
  app:
    build: .
    expose:
      - "8000"
    environment:
      APP_PORT: "8000"
      TRUST_PROXY: "true"
