  pgdata: {}

services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://cache:6379
    depends_on:
      - cache
  cache:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  redis-data: {}

services:
  billing:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  redis-data: {}

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - api
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      REDIS_URL: redis://redis:6379
      QUEUE_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - db
      - redis
      - rabbitmq
  worker:
    build: .
    command: npm run worker
    environment:
      QUEUE_URL: amqp://guest:guest@rabbitmq:5672
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
  redis:
    image: redis:7.4-alpine
  rabbitmq:
    image: rabbitmq:3.13-management

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - api
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      REDIS_URL: redis://redis:6379
      QUEUE_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
