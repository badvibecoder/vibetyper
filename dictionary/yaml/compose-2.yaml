services:
  override-example:
    image: busybox:1.36
    command: echo "override file demo"
  app:
    image: node:20-slim
    command: node server.js
    environment:
      NODE_ENV: development

_format_version: "3.0"
_transform: true
services:
  - name: users-service
    url: http://users-api:8080
    routes:
      - name: users-route
        paths:
          - /users
        methods: [GET, POST]
        strip_path: true
  - name: payments-service
    url: http://payments-api:8080
    routes:
      - name: payments-route
        paths:
          - /payments
        methods: [GET, POST, PUT]
plugins:
  - name: rate-limiting
    config:
      minute: 120
      policy: local
  - name: cors
    config:
      origins:
        - https://app.example.com

version: "3.8"
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
  mailpit:
    image: axllent/mailpit:v1.18
    ports:
      - "1025:1025"
      - "8025:8025"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

services:
  kafka:
    image: apache/kafka:3.7.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

services:
  vault:
    image: hashicorp/vault:1.17.2
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

services:
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      JAEGER_SAMPLER_TYPE: probabilistic
      JAEGER_SAMPLER_PARAM: "0.1"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
volumes:
  ch-data: {}

services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: localdev
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:localdev@mongo:27017
      ME_CONFIG_BASICAUTH: "false"
volumes:
  mongo-data: {}

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
    environment:
      DEFAULT_HOST: app.example.com
  app:
    image: node:20-slim
    environment:
      VIRTUAL_HOST: app.example.com
      VIRTUAL_PORT: "3000"
volumes:
  certs: {}

services:
  app:
    image: node:20-slim
    working_dir: /srv/app
    volumes:
      - .:/srv/app
    command: npm run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: sqlite:///srv/app/dev.db
    ports:
      - "3000:3000"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://mlflow:mlflow@db:5432/mlflow --default-artifact-root s3://mlflow-artifacts
    ports:
      - "5000:5000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow

services:
  scheduler:
    image: apache/airflow:2.9.2
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app_dev
      DB_USER: app
      DB_PASSWORD: localdev
    volumes:
      - .:/app
      - /app/node_modules
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app_dev
      MYSQL_USER: app
      MYSQL_PASSWORD: localdev
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-dev:/var/lib/mysql
volumes:
  mysql-dev: {}

services:
  web:
    image: node:20-slim
    working_dir: /srv/app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./web:/srv/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  whoami:
    image: traefik/whoami:v1.10
    labels:
      - "traefik.http.routers.whoami.rule=Host(`whoami.localhost`)"

services:
  primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pg-data:/var/lib/postgresql/data
  documents:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: app_docs
    volumes:
      - mongo-data:/data/db
volumes:
  pg-data: {}
  mongo-data: {}

services:
  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001

services:
  app:
    image: python:3.12-slim
    working_dir: /srv/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/srv/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      PYTHONPATH: /srv/app
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app

services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: "true"
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
