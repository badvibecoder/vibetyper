openapi: 3.0.3
info:
  title: Catalog API
  version: 2.1.0
  description: Product catalog with search and inventory.
paths:
  /products:
    get:
      summary: List products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: A page of products

openapi: 3.0.3
info:
  title: Orders API
  version: 1.4.0
paths:
  /orders:
    post:
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
        "400":
          description: Invalid payload
  /orders/{order_id}:
    get:
      summary: Fetch an order by id
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
        "404":
          description: Order not found

components:
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid

openapi: 3.0.3
info:
  title: Auth API
  version: 3.0.0
servers:
  - url: https://auth.example.com
security:
  - bearerAuth: []
paths:
  /token:
    post:
      summary: Exchange credentials for a token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token, authorization_code]
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token issued

openapi: 3.0.3
info:
  title: Webhook API
  version: 1.0.0
paths:
  /events:
    post:
      summary: Receive a webhook delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [invoice.paid, invoice.failed, customer.created]
                data:
                  type: object
                created:
                  type: integer
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Signature verification failed

openapi: 3.0.3
info:
  title: Weather Service
  version: 0.9.0
paths:
  /v1/forecast:
    get:
      summary: Get forecast for a location
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lon
          in: query
          required: true
          schema:
            type: number
        - name: units
          in: query
          schema:
            type: string
            enum: [metric, imperial]
            default: metric
      responses:
        "200":
          description: Forecast data
